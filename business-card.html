<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DPT | Digital Business Card</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:32px 16px;background:#111;font-family:Arial,Helvetica,sans-serif;color:#fff}
.card{max-width:760px;margin:auto;background:linear-gradient(145deg,#0a0a0a,#171717);border:1px solid #c99738;border-radius:28px;overflow:hidden;box-shadow:0 25px 70px rgba(0,0,0,.45)}
.brand{padding:44px 36px 24px;text-align:center}
.logo{width:300px;max-width:78%;height:auto;display:block;margin:auto}
.rule{height:1px;background:linear-gradient(90deg,transparent,#d4a13c,transparent);margin:24px auto;width:82%}
h1{font-family:Georgia,serif;font-size:32px;font-weight:500;margin:0;color:#e0b85f}
.tag{margin:10px auto 0;font-size:12px;letter-spacing:2px;line-height:1.7;color:#eee;text-transform:uppercase}
.info{padding:6px 38px 38px;max-width:560px;margin:auto}
.row{padding:12px 0;border-bottom:1px solid #2e2e2e;font-size:15px}
.row a{color:#fff;text-decoration:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}
.btn{padding:14px 12px;text-align:center;border-radius:999px;text-decoration:none;font-size:11px;font-weight:700;letter-spacing:1px}
.gold{background:#d0a344;color:#090909}
.outline{border:1px solid #d0a344;color:#fff}
@media(max-width:560px){.actions{grid-template-columns:1fr}.brand{padding:34px 20px 20px}.info{padding:5px 24px 30px}}
</style>
</head>
<body>
<main class="card">
<section class="brand">
<img src="assets/dpt-logo.png" class="logo" alt="DPT Logo">
<div class="rule"></div>
<h1>Dimakatso’s Professional Touch</h1>
<div class="tag">Luxury Career Positioning · Digital Branding<br>Professional Presence With Authority</div>
</section>
<section class="info">
<div class="row">☎ <a href="tel:+27720231884">+27 72 023 1884</a></div>
<div class="row">✉ <a href="mailto:Dimakatsosprofessionaltouch@gmail.com">Dimakatsosprofessionaltouch@gmail.com</a></div>
<div class="row">🌐 <a href="https://dimakatso-professional-touch-website.netlify.app/" target="_blank">Visit Website</a></div>
<div class="row">in <a href="https://www.linkedin.com/company/122284145/admin/dashboard/" target="_blank">LinkedIn</a></div>
<div class="actions">
<a class="btn gold" href="DPT-Contact.vcf" download>SAVE CONTACT</a>
<a class="btn outline" href="https://dimakatso-professional-touch-website.netlify.app/portfolio" target="_blank">VIEW PORTFOLIO</a>
</div>
</section>

</body>
</html>
